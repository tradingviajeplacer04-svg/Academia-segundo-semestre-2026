<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuestionario Clase 1: Los Profetas del Antiguo Testamento</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hidden { display: none; }
        .correct { color: #15803d; font-weight: bold; }
        .incorrect { color: #b91c1c; font-weight: bold; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-8 font-sans">
    <div class="max-w-2xl mx-auto bg-white p-8 rounded-lg shadow-md">
        <h1 class="text-3xl font-bold text-center text-blue-800 mb-6">Cuestionario: Los Profetas del Antiguo Testamento</h1>
        

        <div id="quiz-container">
            <!-- Las preguntas se inyectarán aquí vía JavaScript -->
        </div>

        <div class="mt-6 flex justify-between">
            <button id="prev-btn" class="hidden bg-gray-500 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline transition duration-150">Anterior</button>
            <button id="next-btn" class="bg-blue-600 hover:bg-blue-800 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline transition duration-150">Siguiente</button>
            <button id="submit-btn" class="hidden bg-green-600 hover:bg-green-800 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline transition duration-150">Finalizar y Ver Calificación</button>
        </div>

        <div id="result-container" class="hidden mt-8 p-6 bg-blue-50 border border-blue-200 rounded-lg text-center">
            <h2 class="text-2xl font-bold text-blue-900 mb-2">Resultados Finales</h2>
            <p class="text-xl">Tu nota es: <span id="score-display" class="font-extrabold text-3xl text-blue-700"></span> / 7</p>
            <p id="feedback-message" class="mt-4 text-gray-700"></p>
            <button onclick="location.reload()" class="mt-6 bg-blue-600 hover:bg-blue-800 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline transition duration-150">Volver a intentar</button>
        </div>
    </div>

    <script>
        const quizData = [
            {
                question: "1. ¿Con qué personaje bíblico se afirma que comenzó el oficio profético con sus varias funciones?",
                options: [
                    "A. Con Abraham",
                    "B. Con Moisés",
                    "C. Con Jeremías"
                ],
                answer: 1 // Índice de la respuesta correcta (B)
            },
            {
                question: "2. Según Éxodo 7:1-2, ¿cuál era la función principal del profeta, ilustrada en la relación entre Moisés y Aarón?",
                options: [
                    "A. Originar mensajes para el pueblo",
                    "B. Representar al pueblo ante Dios",
                    "C. Hablar las palabras de Dios en Su nombre"
                ],
                answer: 2 // Índice de la respuesta correcta (C)
            },
            {
                question: "3. ¿Qué diferencia de énfasis existe entre los términos 'nabhi' (profeta) y 'ro'eh' (vidente)?",
                options: [
                    "A. 'Ro'eh' enfatiza la proclamación, 'nabhi' la recepción.",
                    "B. 'Nabhi' destaca la obra activa de proclamar, 'ro'eh' la recepción del mensaje.",
                    "C. No hay diferencia, significan exactamente lo mismo."
                ],
                answer: 1 // Índice de la respuesta correcta (B)
            },
            {
                question: "4. En Israel existían dos clases de mediadores, el sacerdote y el profeta. ¿Cuál era la función principal del sacerdote en contraste con el profeta?",
                options: [
                    "A. El sacerdote hablaba al pueblo de parte de Dios.",
                    "B. El sacerdote actuaba como vigía sobre los gobernantes.",
                    "C. El sacerdote representaba al pueblo delante de Dios."
                ],
                answer: 2 // Índice de la respuesta correcta (C)
            },
            {
                question: "5. Además de ser predicadores y predictores, los profetas actuaban como 'vigías'. ¿Qué implicaba principalmente esta función?",
                options: [
                    "A. Ser fiscales que acusaban al pueblo por violar el pacto y llamaban al arrepentimiento.",
                    "B. Ser políticos interesados en el poder de la monarquía de Israel.",
                    "C. Proteger las fronteras de Israel de los ejércitos enemigos."
                ],
                answer: 0 // Índice de la respuesta correcta (A)
            },
            {
                question: "6. ¿Por qué los profetas se referían frecuentemente a la tierra de Israel en sus mensajes?",
                options: [
                    "A. Porque la tierra era un indicador visible de la condición espiritual de Israel.",
                    "B. Porque su principal preocupación era la producción agrícola para el templo.",
                    "C. Para enseñar técnicas de cultivo a los campesinos israelitas."
                ],
                answer: 0 // Índice de la respuesta correcta (A)
            },
            {
                question: "7. ¿Qué significa la designación de profeta 'mayor' o 'menor' en el estudio cronológico sugerido?",
                options: [
                    "A. Indica la importancia espiritual del profeta ante Dios.",
                    "B. Se refiere a la edad que tenía el profeta al recibir el llamamiento.",
                    "C. Significa simplemente que la extensión de su mensaje escrito es mayor o menor."
                ],
                answer: 2 // Índice de la respuesta correcta (C)
            }
        ];

        let currentQuestion = 0;
        let userAnswers = new Array(quizData.length).fill(null);

        const quizContainer = document.getElementById('quiz-container');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const submitBtn = document.getElementById('submit-btn');
        const resultContainer = document.getElementById('result-container');
        const scoreDisplay = document.getElementById('score-display');
        const feedbackMessage = document.getElementById('feedback-message');

        function buildQuiz() {
            quizContainer.innerHTML = '';
            quizData.forEach((q, index) => {
                const questionDiv = document.createElement('div');
                questionDiv.classList.add('question-block', 'mb-6');
                if (index !== 0) questionDiv.classList.add('hidden');
                questionDiv.id = `question-${index}`;

                const questionTitle = document.createElement('h2');
                questionTitle.classList.add('text-xl', 'font-semibold', 'mb-4', 'text-gray-800');
                questionTitle.textContent = q.question;
                questionDiv.appendChild(questionTitle);

                const optionsList = document.createElement('div');
                optionsList.classList.add('space-y-3');

                q.options.forEach((opt, optIndex) => {
                    const label = document.createElement('label');
                    label.classList.add('flex', 'items-center', 'p-3', 'border', 'rounded', 'cursor-pointer', 'hover:bg-blue-50', 'transition', 'duration-150');
                    
                    const radio = document.createElement('input');
                    radio.type = 'radio';
                    radio.name = `question${index}`;
                    radio.value = optIndex;
                    radio.classList.add('mr-3', 'h-4', 'w-4', 'text-blue-600');
                    
                    if (userAnswers[index] === optIndex) {
                        radio.checked = true;
                    }

                    radio.addEventListener('change', () => {
                        userAnswers[index] = optIndex;
                    });

                    const span = document.createElement('span');
                    span.textContent = opt;
                    span.classList.add('text-gray-700');

                    label.appendChild(radio);
                    label.appendChild(span);
                    optionsList.appendChild(label);
                });

                questionDiv.appendChild(optionsList);
                quizContainer.appendChild(questionDiv);
            });
            updateButtons();
        }

        function showQuestion(index) {
            document.querySelectorAll('.question-block').forEach(el => el.classList.add('hidden'));
            document.getElementById(`question-${index}`).classList.remove('hidden');
        }

        function updateButtons() {
            prevBtn.classList.toggle('hidden', currentQuestion === 0);
            
            if (currentQuestion === quizData.length - 1) {
                nextBtn.classList.add('hidden');
                submitBtn.classList.remove('hidden');
            } else {
                nextBtn.classList.remove('hidden');
                submitBtn.classList.add('hidden');
            }
        }

        prevBtn.addEventListener('click', () => {
            if (currentQuestion > 0) {
                currentQuestion--;
                showQuestion(currentQuestion);
                updateButtons();
            }
        });

        nextBtn.addEventListener('click', () => {
            if (currentQuestion < quizData.length - 1) {
                currentQuestion++;
                showQuestion(currentQuestion);
                updateButtons();
            }
        });

        submitBtn.addEventListener('click', () => {
            // Verificar si todas las preguntas fueron respondidas
            if (userAnswers.includes(null)) {
                alert("Por favor, responde todas las preguntas antes de finalizar.");
                return;
            }

            let score = 0;
            quizData.forEach((q, i) => {
                if (userAnswers[i] === q.answer) {
                    score++;
                }
            });

            // Ocultar preguntas y botones
            quizContainer.classList.add('hidden');
            prevBtn.classList.add('hidden');
            nextBtn.classList.add('hidden');
            submitBtn.classList.add('hidden');

            // Mostrar resultados
            resultContainer.classList.remove('hidden');
            scoreDisplay.textContent = score;

            let message = "";
            if (score === 7) message = "¡Excelente! Has demostrado un conocimiento perfecto del material.";
            else if (score >= 5) message = "¡Muy buen trabajo! Tienes un sólido entendimiento de los profetas.";
            else if (score >= 4) message = "Aprobaste, pero te vendría bien repasar algunas partes del documento.";
            else message = "Te recomiendo leer nuevamente el material de estudio e intentarlo de nuevo.";
            
            feedbackMessage.textContent = message;
        });

        // Inicializar el cuestionario
        buildQuiz();
    </script>
</body>
</html>
